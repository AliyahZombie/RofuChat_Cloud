name: app

on:
  push:
    branches: [main]
    paths: ['app/**', 'backend/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', 'backend/**', '.github/workflows/app.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # NDK r27c: newer NDKs reject the unversioned target triples bindgen passes for rquickjs.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Build embedded backend (Android)
        if: hashFiles('backend/Cargo.toml') != ''
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          tool/build_native.sh android
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: rofuchat-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - name: Build embedded backend (Linux)
        if: hashFiles('backend/Cargo.toml') != ''
        run: tool/build_native.sh linux
      - run: flutter build linux --release
      - run: tar -czf rofuchat-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v4
        with:
          name: rofuchat-linux-x64
          path: app/rofuchat-linux-x64.tar.gz

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build embedded backend (Windows)
        if: hashFiles('backend/Cargo.toml') != ''
        shell: bash
        run: tool/build_native.sh windows
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath rofuchat-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: rofuchat-windows-x64
          path: app/rofuchat-windows-x64.zip

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: rofuchat-web
          path: app/build/web
