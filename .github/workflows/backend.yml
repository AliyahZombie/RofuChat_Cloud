name: Backend
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml', 'docs/backend-spec.md']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml', 'docs/backend-spec.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rofu_ci
          POSTGRES_PASSWORD: ephemeral_ci_password
          POSTGRES_DB: rofu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rofu_ci -d rofu_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ROFU_TEST_PG_URL: postgres://rofu_ci:ephemeral_ci_password@127.0.0.1:5432/rofu_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.os }}
          path: |
            backend/target/release/rofu-server
            backend/target/release/librofu_ffi.so
            backend/target/release/librofu_ffi.a
            backend/include/rofu.h
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build -p rofu-ffi --release
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: backend-android
          path: |
            backend/target/aarch64-linux-android/release/librofu_ffi.so
            backend/target/armv7-linux-androideabi/release/librofu_ffi.so
            backend/target/x86_64-linux-android/release/librofu_ffi.so
            backend/include/rofu.h
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo build -p rofu-ffi -p rofu-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: backend-windows-msvc
          path: |
            backend/target/release/rofu-server.exe
            backend/target/release/rofu_ffi.dll
            backend/target/release/rofu_ffi.lib
            backend/include/rofu.h
