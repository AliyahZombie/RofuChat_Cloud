include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # package:flutter/material.dart is deprecated in favour of material_ui since 3.47,
    # but md_single_block_renderer reads Theme from flutter/material, so the app must share it.
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
  exclude:
    - build/**
    - android/**
    - web/**
    - windows/**
    - linux/**
linter:
  rules:
    prefer_const_constructors: false
    use_build_context_synchronously: false
