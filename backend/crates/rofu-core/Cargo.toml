[package]
name = "rofu-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "sqlite", "postgres"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

rquickjs = { version = "0.9", features = ["parallel"] }
png = "0.17"

[dev-dependencies]
tempfile = "3"

# rquickjs-sys ships no pregenerated bindings for Android targets; generate them with bindgen
# (libclang from the runner, NDK sysroot passed by cargo-ndk).
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.9", features = ["parallel", "bindgen"] }
